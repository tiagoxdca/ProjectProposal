name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  unit-tests:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Unit Tests
        run: |
          set -o pipefail

          DEVICE_UDID=$(xcrun simctl list devices available | \
            grep -m 1 -E "iPhone" | \
            sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')

          echo "Using simulator UDID: $DEVICE_UDID"

          xcodebuild test \
            -project ProjectProposal.xcodeproj \
            -scheme "ProjectProposal-UnitTests" \
            -destination "id=$DEVICE_UDID"
