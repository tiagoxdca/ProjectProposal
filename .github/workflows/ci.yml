jobs:
  unit-tests:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Xcode version
        run: xcodebuild -version

      - name: Show destinations (debug)
        run: xcodebuild -showdestinations -project ProjectProposal.xcodeproj -scheme "ProjectProposal-UnitTests"

      - name: Unit Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ProjectProposal.xcodeproj \
            -scheme "ProjectProposal-UnitTests" \
            -destination "platform=iOS Simulator,name=Any iOS Simulator Device"
