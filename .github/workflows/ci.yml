name: iOS Unit Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Run tests (iOS Simulator)
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          xcodebuild test \
            -project ProjectProposal.xcodeproj \
            -scheme "ProjectProposal-UnitTests" \
            -sdk iphonesimulator \
            -destination "id=$UDID"
